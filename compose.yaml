name: ${COMPOSE_PROJECT_NAME}

include:
    - compose.airflow.yaml

services:
    oracle:
        image: gvenzl/oracle-free:${ORACLE_IMAGE_TAG}
        container_name: ${COMPOSE_PROJECT_NAME}-oracle
        hostname: oracle
        ports:
            - "${ORACLE_HOST_PORT}:1521"
        environment:
            ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
            APP_USER: ${ORACLE_APP_USER}
            APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD}
        healthcheck:
            test: ["CMD", "healthcheck.sh"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 5s
            start_interval: 5s
        volumes:
            - ${ORACLE_DATA_VOLUME}:/opt/oracle/oradata
            - ./src/sql/init.sql:/container-entrypoint-initdb.d/init.sql:ro
        networks:
            - ${NETWORK_NAME}

    minio:
        image: minio/minio:${MINIO_IMAGE_TAG}
        container_name: ${COMPOSE_PROJECT_NAME}-minio
        hostname: minio
        ports:
            - "${MINIO_HOST_PORT_API}:9000"
            - "${MINIO_HOST_PORT_CONSOLE}:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
            MINIO_REGION: us-east-1
            MINIO_DOMAIN: minio
            MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
            MINIO_SERVER_URL: http://localhost:9000
            MINIO_CONSOLE_ADDRESS: ":9001"
            MINIO_ADDRESS: ":9000"
            MINIO_VOLUMES: "/data"
            MINIO_HTTP_TRACE: "/dev/stdout"
        command: server --console-address ":9001" --address ":9000" /data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        volumes:
            - ${MINIO_DATA_VOLUME}:/data
        networks:
            - ${NETWORK_NAME}

    clickhouse-server:
        image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-23.8}
        container_name: ${COMPOSE_PROJECT_NAME}-clickhouse
        hostname: clickhouse
        ports:
            - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
            - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
        environment:
            CLICKHOUSE_DB: ${CLICKHOUSE_DB:-bank}
            CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_ACCESS_MANAGEMENT:-1}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        volumes:
            - ${CLICKHOUSE_DATA_VOLUME:-./volumes/clickhouse/data}:/var/lib/clickhouse
            - ${CLICKHOUSE_LOG_VOLUME:-./volumes/clickhouse/logs}:/var/log/clickhouse-server
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - ${NETWORK_NAME}

networks:
    oracle2clickhouse-net:
        driver: bridge
        name: ${NETWORK_NAME}